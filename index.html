<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <div id="launcher" class="launcher" role="main">
      <header class="launcher-header">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="var(--accent)"/>
            <path d="M10 20 L20 10 L30 20 L20 30 Z" fill="rgba(255,255,255,0.25)"/>
            <circle cx="20" cy="20" r="5" fill="#fff"/>
          </svg>
          <span>Jarvis Office</span>
        </div>
        <div class="launcher-right">
          <time id="clock" aria-live="polite"></time>
          <button id="btn-settings" class="btn-icon" aria-label="Einstellungen öffnen">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 2v1.5M10 16.5V18M2 10h1.5M16.5 10H18M4.22 4.22l1.06 1.06M14.72 14.72l1.06 1.06M4.22 15.78l1.06-1.06M14.72 5.28l1.06-1.06"/></svg>
          </button>
        </div>
      </header>

      <main class="launcher-grid" id="launcher-grid" role="list" aria-label="Anwendungen">
      </main>

      <footer class="launcher-footer">
        <span>Jarvis Office v2.0</span>
      </footer>
    </div>

    <div id="app-container" class="app-container hidden" role="region" aria-label="Aktive Anwendung"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/launcher.js"></script>
  <script src="js/write.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/present.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/anydoc.js"></script>
</body>
</html>
