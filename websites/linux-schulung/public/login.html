<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Linuxschulung</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav-wrap">
    <a href="index.html" class="logo">Linux<span>schulung</span></a>
  </div>
</header>

<main class="wrap page narrow">
  <h1>Konto</h1>
  <p class="muted">Ein Konto brauchst du, um Kurse zu kaufen und die Lektionen zu öffnen.</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login" class="tab active">Anmelden</button>
    <button type="button" role="tab" id="tab-reg" aria-selected="false" aria-controls="form-reg" class="tab">Neues Konto</button>
  </div>

  <form id="form-login" class="form" role="tabpanel" aria-labelledby="tab-login">
    <label>E-Mail <input name="email" type="email" required autocomplete="email"></label>
    <label>Passwort <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Anmelden</button>
  </form>

  <form id="form-reg" class="form" role="tabpanel" aria-labelledby="tab-reg" hidden>
    <label>Dein Name <input name="name" type="text" required autocomplete="name"></label>
    <label>E-Mail <input name="email" type="email" required autocomplete="email"></label>
    <label>Passwort (mindestens 8 Zeichen) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Konto anlegen</button>
  </form>

  <p id="loginmsg" class="error" role="status"></p>
</main>

<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const target = params.get("weiter") || "index.html";
  // Nur eigene Seiten als Ziel erlauben, keine fremden Adressen
  const safeTarget = /^[a-z0-9_.?=&%-]+$/i.test(target) && !target.startsWith("//") ? target : "index.html";

  const tabs = {
    login: [document.getElementById("tab-login"), document.getElementById("form-login")],
    reg: [document.getElementById("tab-reg"), document.getElementById("form-reg")],
  };
  function show(which) {
    for (const [key, [tab, form]] of Object.entries(tabs)) {
      const on = key === which;
      tab.classList.toggle("active", on);
      tab.setAttribute("aria-selected", String(on));
      form.hidden = !on;
    }
    document.getElementById("loginmsg").textContent = "";
  }
  tabs.login[0].addEventListener("click", () => show("login"));
  tabs.reg[0].addEventListener("click", () => show("reg"));

  function formData(form) {
    return Object.fromEntries(new FormData(form).entries());
  }

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("loginmsg");
    try {
      await api("/api/login", { method: "POST", body: formData(e.target) });
      location.href = safeTarget;
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  document.getElementById("form-reg").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("loginmsg");
    try {
      await api("/api/register", { method: "POST", body: formData(e.target) });
      location.href = safeTarget;
    } catch (err) {
      msg.textContent = err.message;
    }
  });

  if (params.get("tab") === "reg") show("reg");
</script>
</body>
</html>
