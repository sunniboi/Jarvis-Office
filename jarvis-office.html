<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* ===== JARVIS OFFICE v2 — DESIGN SYSTEM ===== */

/* --- Tokens --- */
:root {
  --bg:           #0d0d1a;
  --bg-elevated:  #161628;
  --bg-sunken:    #0a0a14;
  --surface:      #1c1c36;
  --surface-hi:   #242448;
  --border:       #2a2a52;
  --border-hi:    #3a3a72;
  --text:         #e2e8f0;
  --text-muted:   #8b9cb5;
  --text-faint:   #586880;
  --accent:       #7c3aed;
  --accent-hi:    #9d5cf5;
  --on-accent:    #ffffff;
  --danger:       #c81e1e;
  --on-danger:    #ffffff;
  --success:      #166534;
  --on-success:   #ffffff;
  --warning:      #f59e0b;

  --app-write:    #3b82f6;
  --app-calc:     #10b981;
  --app-matrix:   #f59e0b;
  --app-draw:     #ec4899;
  --app-present:  #8b5cf6;
  --app-mail:     #06b6d4;
  --app-notes:    #f97316;
  --app-calendar: #14b8a6;

  --font-sans: Inter, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;

  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
  --shadow-md: 0 4px 24px rgba(0,0,0,.45);
  --shadow-lg: 0 8px 48px rgba(0,0,0,.65);

  --h-titlebar:  38px;
  --h-toolbar:   44px;
  --h-statusbar: 22px;
  --w-sidebar:   220px;
}

/* --- Reset --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font-family: inherit; }

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-sunken); }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ========== LAUNCHER ========== */
.launcher { height: 100vh; display: flex; flex-direction: column; }

.launcher-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; border-bottom: 1px solid var(--border);
  background: var(--bg-elevated); flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--text); }
.launcher-right { display: flex; align-items: center; gap: 12px; }
#clock { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.launcher-grid {
  flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; padding: 28px; overflow-y: auto; align-content: start;
}

.app-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 22px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer; transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
  text-align: center;
}
.app-card:hover { border-color: var(--accent); background: var(--surface-hi); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.app-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app-card:active { transform: translateY(0); box-shadow: none; }

.app-icon { width: 52px; height: 52px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; }
.app-icon svg { width: 32px; height: 32px; }
.app-name { font-size: 14px; font-weight: 600; color: var(--text); }
.app-desc { font-size: 11px; color: var(--text-muted); }

.launcher-footer {
  padding: 12px 28px; border-top: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--text-faint); font-size: 11px;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

/* ========== GLOBAL APP CHROME ========== */
.app-container { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.app-container.hidden { display: none; }

.app-titlebar {
  height: var(--h-titlebar); background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 10px; gap: 8px; flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; background: none; border: none;
  color: var(--text-muted); cursor: pointer; border-radius: var(--r-sm);
  transition: color 120ms, background 120ms;
}
.back-btn:hover { color: var(--text); background: var(--surface); }
.back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back-btn svg { width: 18px; height: 18px; }

.app-title { font-size: 13px; font-weight: 600; }
.filename { font-size: 12px; color: var(--text-muted); }
.titlebar-actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }

.toolbar {
  height: var(--h-toolbar); background: var(--bg-sunken);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 6px; gap: 1px;
  flex-shrink: 0; overflow-x: auto;
}

.tb-btn {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 5px 7px; border-radius: var(--r-sm);
  font-size: 12px; white-space: nowrap; font-weight: 500;
  transition: color 100ms, background 100ms;
  display: flex; align-items: center; gap: 4px; height: 32px;
}
.tb-btn:hover { color: var(--text); background: var(--surface); }
.tb-btn.active { color: var(--accent-hi); background: var(--surface-hi); }
.tb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tb-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; flex-shrink: 0; }

.tb-select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--r-sm); padding: 3px 6px;
  font-size: 12px; font-family: var(--font-sans); cursor: pointer; height: 28px;
}
.tb-select:focus { outline: none; border-color: var(--accent); }

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--r-md); border: none;
  font-size: 13px; font-weight: 500; font-family: var(--font-sans);
  cursor: pointer; transition: background 150ms, color 150ms;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hi); }
.btn-ghost { background: none; color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface); color: var(--text); }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-icon {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; background: none; border: none;
  color: var(--text-muted); cursor: pointer; border-radius: var(--r-sm);
  transition: color 120ms, background 120ms;
}
.btn-icon:hover { color: var(--text); background: var(--surface); }
.btn-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-icon svg { width: 18px; height: 18px; }

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px); animation: fadeIn 150ms ease;
}
.modal {
  background: var(--surface); border: 1px solid var(--border-hi);
  border-radius: var(--r-lg); padding: 22px; min-width: 340px; max-width: 92vw;
  box-shadow: var(--shadow-lg); animation: slideUp 180ms ease;
}
.modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

/* ========== STATUSBAR ========== */
.statusbar {
  height: var(--h-statusbar); background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 10px; gap: 14px;
  font-size: 11px; color: var(--text-faint); flex-shrink: 0;
}
.statusbar span { white-space: nowrap; }

/* ========== SIDEBAR ========== */
.sidebar {
  background: var(--bg-elevated); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
}
.sidebar-header {
  padding: 10px 12px; font-size: 10px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text-faint);
  border-bottom: 1px solid var(--border);
}
.sidebar-list { flex: 1; overflow-y: auto; }
.sidebar-item {
  padding: 7px 10px; cursor: pointer; font-size: 13px; color: var(--text-muted);
  border-radius: var(--r-sm); margin: 2px 4px;
  display: flex; align-items: center; gap: 8px;
  transition: background 100ms, color 100ms;
}
.sidebar-item:hover { background: var(--surface); color: var(--text); }
.sidebar-item.active { background: var(--surface-hi); color: var(--accent-hi); }

/* ========== FORM ========== */
input[type=text], input[type=email], input[type=number], input[type=search], textarea, select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--r-md); padding: 7px 10px;
  font-size: 13px; font-family: var(--font-sans); width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.18); }
label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
.form-group { margin-bottom: 14px; }

/* ========== ANIMATIONS ========== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ========== UTILITIES ========== */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.overflow-hidden { overflow: hidden; }

/* ========== WRITE ========== */
.write-layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.write-body { flex: 1; overflow-y: auto; background: var(--bg-sunken); display: flex; justify-content: center; padding: 24px 16px; }
.write-page {
  background: #fff; color: #111827; width: 794px; min-height: 1040px;
  padding: 72px 80px; border-radius: 2px;
  box-shadow: 0 2px 24px rgba(0,0,0,.55);
  outline: none; font-family: Georgia, serif; font-size: 14px; line-height: 1.7;
}
.write-page h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
.write-page h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.write-page h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.write-page p  { margin-bottom: 10px; }
.write-page ul, .write-page ol { margin: 8px 0 8px 24px; }
.write-page table { border-collapse: collapse; margin: 10px 0; width: 100%; }
.write-page td, .write-page th { border: 1px solid #d1d5db; padding: 6px 10px; }
.write-page th { background: #f9fafb; font-weight: 600; }
.write-page blockquote { border-left: 3px solid #9ca3af; margin: 10px 0 10px 0; padding: 4px 16px; color: #4b5563; font-style: italic; }
.write-page pre, .write-page code { font-family: monospace; background: #f3f4f6; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.write-page hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }
.write-page a { color: #2563eb; }

/* ========== CALC ========== */
.calc-layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.calc-formula-bar {
  height: 32px; background: var(--bg-sunken); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 8px; gap: 8px; flex-shrink: 0;
}
.calc-cell-ref {
  width: 68px; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 2px 6px; font-size: 12px; font-family: var(--font-mono);
  border-radius: var(--r-sm); text-align: center; height: 24px;
}
.calc-formula-input {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 2px 8px; font-size: 13px; font-family: var(--font-mono);
  border-radius: var(--r-sm); height: 24px;
}
.calc-formula-input:focus { outline: none; border-color: var(--accent); }
.calc-body { flex: 1; overflow: auto; position: relative; }
.calc-grid-wrap { display: inline-block; min-width: 100%; }
.calc-header-row { display: flex; position: sticky; top: 0; z-index: 10; }
.col-header {
  width: 100px; height: 22px; background: var(--bg-elevated);
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-faint); font-weight: 600; flex-shrink: 0;
  user-select: none; cursor: pointer;
}
.col-header:hover { background: var(--surface); color: var(--text-muted); }
.row-header {
  width: 48px; height: 22px; background: var(--bg-elevated);
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-faint); font-weight: 600; flex-shrink: 0; user-select: none;
}
.corner-header { width: 48px; height: 22px; background: var(--bg-elevated); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.calc-row { display: flex; }
.calc-cell {
  width: 100px; height: 22px; border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border); padding: 0 4px;
  font-size: 12px; font-family: var(--font-mono); color: var(--text);
  display: flex; align-items: center; flex-shrink: 0; cursor: cell;
  white-space: nowrap; overflow: hidden; background: var(--bg); position: relative;
}
.calc-cell:hover { background: var(--surface); }
.calc-cell.selected { background: rgba(124,58,237,.15); outline: 2px solid var(--accent); outline-offset: -1px; }
.calc-cell.in-range { background: rgba(124,58,237,.07); }
.calc-cell.editing { background: var(--bg) !important; outline: 2px solid var(--accent-hi) !important; outline-offset: -1px; }
.calc-cell input { width: 100%; height: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 12px; font-family: var(--font-mono); padding: 0; }
.cell-formula { color: var(--app-calc); }
.cell-error { color: var(--danger); }
.cell-number { justify-content: flex-end; }

/* ========== MATRIX ========== */
.matrix-layout { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
.matrix-toolbar-ext { height: 36px; background: var(--bg-sunken); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; gap: 6px; flex-shrink: 0; }
.matrix-search { flex: 1; max-width: 280px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--r-md); padding: 4px 10px; font-size: 12px; height: 28px; }
.matrix-search:focus { outline: none; border-color: var(--accent); }
.matrix-table-wrap { flex: 1; overflow: auto; }
.matrix-table { border-collapse: collapse; min-width: 100%; font-size: 13px; }
.matrix-table th {
  background: var(--bg-elevated); color: var(--text-muted); font-weight: 600;
  font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
  padding: 6px 10px; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border);
  white-space: nowrap; position: sticky; top: 0; cursor: pointer; user-select: none;
}
.matrix-table th:hover { color: var(--text); background: var(--surface); }
.matrix-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text); vertical-align: middle; }
.matrix-table tr:hover td { background: var(--surface); }
.matrix-table tr.selected td { background: rgba(124,58,237,.12); }
.progress-bar-wrap { background: var(--bg-sunken); border-radius: var(--r-sm); height: 8px; overflow: hidden; min-width: 60px; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: var(--r-sm); transition: width 200ms; }
.star-rating { color: var(--warning); font-size: 14px; cursor: pointer; user-select: none; }
.matrix-summary { background: var(--bg-elevated); border-top: 2px solid var(--border); font-size: 12px; color: var(--text-muted); font-weight: 600; }
.matrix-summary td { padding: 5px 10px; }

/* ========== DRAW ========== */
.draw-layout { display: flex; flex: 1; overflow: hidden; }
.draw-tools {
  width: 44px; background: var(--bg-elevated); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 2px; flex-shrink: 0;
}
.draw-tool-btn {
  width: 32px; height: 32px; background: none; border: none;
  border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  transition: background 100ms, color 100ms;
}
.draw-tool-btn:hover { background: var(--surface); color: var(--text); }
.draw-tool-btn.active { background: var(--surface-hi); color: var(--accent-hi); }
.draw-tool-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.draw-tool-sep { width: 28px; height: 1px; background: var(--border); margin: 3px 0; }
.draw-canvas-wrap { flex: 1; overflow: hidden; background: #101020; display: flex; align-items: center; justify-content: center; position: relative; }
.draw-canvas { background: #fff; cursor: crosshair; display: block; }
.draw-props { width: 196px; background: var(--bg-elevated); border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; flex-shrink: 0; }
.draw-props h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-faint); margin-bottom: 10px; }
.prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; font-size: 12px; color: var(--text-muted); }
.prop-row input[type=color] { width: 28px; height: 22px; padding: 1px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.prop-row input[type=number], .prop-row input[type=range] { width: 80px; padding: 2px 6px; height: 24px; }

/* ========== PRESENT ========== */
.present-layout { display: flex; flex: 1; overflow: hidden; }
.slides-panel { width: 176px; background: var(--bg-elevated); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.slide-thumb { background: var(--surface); border: 2px solid var(--border); border-radius: var(--r-sm); cursor: pointer; aspect-ratio: 16/9; overflow: hidden; position: relative; transition: border-color 120ms; }
.slide-thumb:hover { border-color: var(--border-hi); }
.slide-thumb.active { border-color: var(--accent); }
.slide-thumb-num { position: absolute; bottom: 4px; left: 4px; font-size: 9px; color: var(--text-faint); background: rgba(0,0,0,.5); padding: 1px 4px; border-radius: 2px; }
.slide-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.slide-stage-wrap { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #080812; }
.slide-stage { width: 960px; height: 540px; background: #fff; position: relative; overflow: hidden; border-radius: 3px; box-shadow: var(--shadow-lg); }
.slide-element { position: absolute; cursor: move; user-select: none; }
.slide-element.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
.slide-element:hover { outline: 1px dashed var(--accent); outline-offset: 2px; }
.present-props { width: 196px; background: var(--bg-elevated); border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; flex-shrink: 0; }

/* ========== MAIL ========== */
.mail-layout { display: flex; flex: 1; overflow: hidden; }
.mail-sidebar { width: 196px; background: var(--bg-elevated); border-right: 1px solid var(--border); padding: 10px 6px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.mail-folder {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border-radius: var(--r-sm); cursor: pointer; color: var(--text-muted); font-size: 13px;
  transition: background 100ms, color 100ms;
}
.mail-folder:hover { background: var(--surface); color: var(--text); }
.mail-folder.active { background: var(--surface-hi); color: var(--accent-hi); }
.mail-folder svg { width: 16px; height: 16px; flex-shrink: 0; }
.mail-badge { margin-left: auto; background: var(--accent); color: var(--on-accent); border-radius: var(--r-full); padding: 1px 7px; font-size: 10px; font-weight: 600; }
.mail-list { width: 276px; background: var(--bg-sunken); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
.mail-item { padding: 11px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 100ms; }
.mail-item:hover { background: var(--surface); }
.mail-item.active { background: var(--surface-hi); border-left: 3px solid var(--accent); }
.mail-item.unread .mail-sender { font-weight: 700; color: var(--text); }
.mail-sender { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mail-subject { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.mail-snippet { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.mail-date { font-size: 10px; color: var(--text-faint); float: right; }

function $(sel, ctx = document) { return ctx.querySelector(sel); }

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);

  for (const c of children) {
    if (c == null) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);

  return e;

function formatTime(d = new Date()) {

  modal.innerHTML = html;

  const btnOk     = modal.querySelector('.btn-ok');

  function close() { overlay.remove(); }

  if (btnOk) {

      onOk && onOk(modal);
    });

  if (btnCancel) {
    btnCancel.addEventListener('click', () => {
      close();
      onCancel && onCancel();
    });

  overlay.addEventListener('click', e => {
    if (e.target === overlay) { close(); onCancel && onCancel(); }

  document.addEventListener('keydown', function esc(e) {

/* ===== JARVIS OFFICE v2 — STORAGE ===== */

const JarvisDB = {
  get(key, def = null) {
    try { const v = localStorage.getItem('jo2_' + key); return v !== null ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(key, val) {
    try { localStorage.setItem('jo2_' + key, JSON.stringify(val)); } catch(e) {
      console.warn('JarvisDB: localStorage voll', e);
    }
  },
  del(key) { localStorage.removeItem('jo2_' + key); },
  keys() {
    return Object.keys(localStorage).filter(k => k.startsWith('jo2_')).map(k => k.slice(4));
  },

  saveDoc(app, id, data) {
    const docs = this.get(`${app}_docs`, {});
    docs[id] = { ...data, id, modified: Date.now() };
    this.set(`${app}_docs`, docs);
    return docs[id];
  },
  loadDoc(app, id) {
    return this.get(`${app}_docs`, {})[id] || null;
  },
  listDocs(app) {
    return Object.values(this.get(`${app}_docs`, {}))
      .sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },
  deleteDoc(app, id) {
    const docs = this.get(`${app}_docs`, {});
    delete docs[id];
    this.set(`${app}_docs`, docs);
  },
  genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
};

  }

  function markClean() {
    dirty = false;
    dirtyEl.textContent = '';
  }

  function getTitle() {
    return titleEl.textContent.trim() || 'Unbenannt';
  }

  function setTitle(t) {
    titleEl.textContent = t || 'Unbenannt';
  }

  function countWords() {
    const text = editor.innerText.trim();
    const words = text ? text.split(/\s+/).length : 0;
    wcEl.textContent = `${words} ${words === 1 ? 'Wort' : 'Wörter'}`;
  }

  // ── Save / Load ───────────────────────────────────────────────────────────
  function saveDoc() {
    const title = getTitle();
    const html  = editor.innerHTML;
    if (!docId) docId = JarvisDB.genId();
    JarvisDB.saveDoc('write', docId, { title, html });
    markClean();
    showNotify('Gespeichert: ' + title, 'success');
  }

  function loadDocById(id) {
    const d = JarvisDB.loadDoc('write', id);
    if (!d) return;
    docId = id;
    setTitle(d.title);
    editor.innerHTML = d.html || '';
    markClean();
    countWords();
    editor.focus();
  }

  function newDoc() {
    if (dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
    docId = null;
    setTitle('Unbenannt');
    editor.innerHTML = '';
    markClean();
    countWords();
    editor.focus();
  }

  function openDocDialog() {
    const docs = JarvisDB.listDocs('write');
    if (!docs.length) { showNotify('Keine gespeicherten Dokumente.', 'info'); return; }

    const rows = docs.map(d => `
      <div class="doc-row" data-id="${sanitize(d.id)}" tabindex="0" role="button" aria-label="${sanitize(d.title)} öffnen">
        <span class="doc-row-title">${sanitize(d.title)}</span>
        <span class="doc-row-date">${formatDateTime(new Date(d.modified))}</span>
        <button class="btn btn-ghost btn-sm doc-delete" data-id="${sanitize(d.id)}" aria-label="Löschen">${icon('trash', 14)}</button>
      </div>`).join('');

    showModal(`
      <h3>Dokument öffnen</h3>
      <div class="doc-list">${rows}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-cancel">Abbrechen</button>
      </div>
    `, null);

    // attach click handlers after modal is in DOM
    container.querySelectorAll('.doc-row').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.doc-delete')) return;
        if (dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
        loadDocById(row.dataset.id);
        row.closest('.modal-overlay')?.remove();
      });
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') row.click();
      });
    });
    container.querySelectorAll('.doc-delete').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Dokument löschen?')) return;
        JarvisDB.deleteDoc('write', btn.dataset.id);
        btn.closest('.doc-row').remove();
        if (docId === btn.dataset.id) { docId = null; setTitle('Unbenannt'); editor.innerHTML = ''; markClean(); }
      });
    });
  }

  // ── Auto-save ─────────────────────────────────────────────────────────────
  autoSaveTimer = setInterval(() => { if (dirty && docId) saveDoc(); }, 30000);

  // ── Toolbar commands ──────────────────────────────────────────────────────
  function execCmd(cmd, val = null) {
    editor.focus();
    document.execCommand(cmd, false, val);
    markDirty();
  }

  container.querySelectorAll('.tb-btn[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault(); // keep focus in editor
      execCmd(btn.dataset.cmd);
    });
  });

  container.querySelector('#write-heading').addEventListener('change', function () {
    if (this.value) execCmd('formatBlock', this.value);
    else execCmd('formatBlock', 'P');
    this.value = '';
  });

  container.querySelector('#write-fontsize').addEventListener('change', function () {
    execCmd('fontSize', 7);
    // execCommand fontSize only supports 1-7; use span hack for exact px
    const spans = editor.querySelectorAll('font[size="7"]');
    spans.forEach(s => {
      const sp = document.createElement('span');
      sp.style.fontSize = this.value + 'px';
      s.replaceWith(...(sp.append(...s.childNodes), [sp]));
    });
  });

  // ── Document events ───────────────────────────────────────────────────────
  editor.addEventListener('input', () => { markDirty(); countWords(); });
  editor.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDoc(); }
  });

  container.querySelector('.back-btn').addEventListener('click', () => {
    if (dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
    clearInterval(autoSaveTimer);
    goHome();
  });

  container.querySelector('#write-new').addEventListener('click', newDoc);
  container.querySelector('#write-open').addEventListener('click', openDocDialog);
  container.querySelector('#write-save').addEventListener('click', saveDoc);

  container.querySelector('#write-export-html').addEventListener('click', () => {
    downloadFile(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${getTitle()}</title></head><body>${editor.innerHTML}</body></html>`,
      getTitle() + '.html', 'text/html');
  });
  container.querySelector('#write-export-txt').addEventListener('click', () => {
    downloadFile(editor.innerText, getTitle() + '.txt', 'text/plain');
  });
  container.querySelector('#write-print').addEventListener('click', () => {
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${getTitle()}</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6}</style></head><body>${editor.innerHTML}</body></html>`);
    w.document.close();
    w.print();
  });

  // Allow inline title rename
  titleEl.setAttribute('contenteditable', 'true');
  titleEl.addEventListener('input', markDirty);
  titleEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); editor.focus(); } });

  countWords();
  editor.focus();
}

  <script>
/* ===== JARVIS OFFICE v2 — CALC ===== */

function initCalc(container) {
  const ROWS = 50, COLS = 26;
  let cells = {};        // { "A1": { raw, val, fmt } }
  let dirty = new Set(); // cells needing re-render
  let selected = { r: 0, c: 0 };
  let docId = null;
  let isDirty = false;

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome calc-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title" id="calc-title" contenteditable="true">Tabelle1</span>
        <div class="titlebar-actions">
          <button class="btn btn-ghost btn-sm" id="calc-new">${icon('filePlus', 15)} Neu</button>
          <button class="btn btn-ghost btn-sm" id="calc-open">${icon('folderOpen', 15)} Öffnen</button>
          <button class="btn btn-primary btn-sm" id="calc-save">${icon('save', 15)} Speichern</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="cell-ref-box" id="calc-ref">A1</span>
          <input type="text" id="calc-formula" class="formula-bar" aria-label="Formelleiste" placeholder="Wert oder =Formel" />
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="btn btn-ghost btn-sm" id="calc-insert-chart">${icon('barChart', 15)} Diagramm</button>
          <button class="btn btn-ghost btn-sm" id="calc-export">${icon('download', 15)} CSV</button>
        </div>
      </div>
      <div class="calc-scroll">
        <table class="calc-table" id="calc-table" role="grid" aria-label="Tabellenkalkulation"></table>
      </div>
      <div class="statusbar">
        <span id="calc-status">Bereit</span>
        <span id="calc-dirty"></span>
      </div>
    </div>
  `;

  const table    = container.querySelector('#calc-table');
  const formulaBar = container.querySelector('#calc-formula');
  const refBox   = container.querySelector('#calc-ref');
  const titleEl  = container.querySelector('#calc-title');
  const dirtyEl  = container.querySelector('#calc-dirty');
  const statusEl = container.querySelector('#calc-status');

  // ── Build table skeleton ──────────────────────────────────────────────────
  function buildTable() {
    const frag = document.createDocumentFragment();
    // header row
    const hrow = document.createElement('tr');
    hrow.appendChild(document.createElement('th')); // corner
    for (let c = 0; c < COLS; c++) {
      const th = document.createElement('th');
      th.textContent = colToLetter(c);
      th.setAttribute('scope', 'col');
      frag.appendChild(th); // temp; we'll add to hrow
      hrow.appendChild(th);
    }
    frag.appendChild(hrow);
    // data rows
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement('tr');
      const rowH = document.createElement('th');
      rowH.textContent = r + 1;
      rowH.setAttribute('scope', 'row');
      row.appendChild(rowH);
      for (let c = 0; c < COLS; c++) {
        const td = document.createElement('td');
        td.dataset.r = r;
        td.dataset.c = c;
        td.setAttribute('tabindex', '-1');
        td.setAttribute('role', 'gridcell');
        row.appendChild(td);
      }
      frag.appendChild(row);
    }
    table.innerHTML = '';
    table.appendChild(frag);
  }

  function getCellEl(r, c) {
    return table.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  }

  // ── Cell key helper ───────────────────────────────────────────────────────
  function key(r, c) { return cellRef(r, c); }

  // ── Formula evaluation ────────────────────────────────────────────────────
  function getCellVal(ref) {
    const v = cells[ref.toUpperCase()]?.val;
    return v === undefined ? 0 : (isNaN(v) ? v : Number(v));
  }

  function evalFormula(expr) {
    if (!expr.startsWith('=')) return isNaN(expr) ? expr : Number(expr) || expr;
    let f = expr.slice(1).trim().toUpperCase();
    try {
      // SUM(A1:B3)
      f = f.replace(/SUM\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, a, b) => {
        let sum = 0;
        const [r1, c1] = refToRC(a), [r2, c2] = refToRC(b);
        for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) sum += Number(getCellVal(cellRef(r, c))) || 0;
        return sum;
      });
      // AVG(A1:B3)
      f = f.replace(/AVG\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, a, b) => {
        let sum = 0, cnt = 0;
        const [r1, c1] = refToRC(a), [r2, c2] = refToRC(b);
        for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { sum += Number(getCellVal(cellRef(r, c))) || 0; cnt++; }
        return cnt ? sum / cnt : 0;
      });
      // MAX / MIN
      f = f.replace(/MAX\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, a, b) => {
        const vals = rangeVals(a, b); return vals.length ? Math.max(...vals) : 0;
      });
      f = f.replace(/MIN\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, a, b) => {
        const vals = rangeVals(a, b); return vals.length ? Math.min(...vals) : 0;
      });
      // COUNT
      f = f.replace(/COUNT\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, a, b) => rangeVals(a, b).filter(v => !isNaN(v)).length);
      // Cell references
      f = f.replace(/\b([A-Z]+\d+)\b/g, ref => {
        const v = getCellVal(ref);
        return typeof v === 'number' ? v : `"${v}"`;
      });
      // eslint-disable-next-line no-new-func
      const result = Function('"use strict"; return (' + f + ')')();
      return isNaN(result) ? result : Number(result.toFixed(10));
    } catch { return '#ERR'; }
  }

  function rangeVals(a, b) {
    const [r1, c1] = refToRC(a), [r2, c2] = refToRC(b);
    const vals = [];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) vals.push(Number(getCellVal(cellRef(r, c))));
    return vals;
  }

  function refToRC(ref) {
    const m = ref.match(/^([A-Z]+)(\d+)$/);
    return m ? [parseInt(m[2]) - 1, letterToCol(m[1])] : [0, 0];
  }

  // ── Dirty-cell rendering ──────────────────────────────────────────────────
  function scheduleRender() {
    requestAnimationFrame(flushDirty);
  }

  function flushDirty() {
    for (const k of dirty) {
      const cell = cells[k];
      const [r, c] = refToRC(k);
      const td = getCellEl(r, c);
      if (!td) continue;
      const display = cell ? String(cell.val === undefined ? '' : cell.val) : '';
      td.textContent = display;
      td.classList.toggle('cell-error', display === '#ERR');
      td.classList.toggle('cell-formula', !!(cell?.raw?.startsWith('=')));
    }
    dirty.clear();
  }

  function setCellRaw(r, c, raw) {
    const k = key(r, c);
    if (raw === '' || raw === undefined) {
      delete cells[k];
    } else {
      const val = evalFormula(raw);
      cells[k] = { raw, val };
    }
    dirty.add(k);
    isDirty = true;
    dirtyEl.textContent = '● Ungespeichert';
    scheduleRender();
  }

  // ── Selection ─────────────────────────────────────────────────────────────
  function selectCell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    const prev = getCellEl(selected.r, selected.c);
    prev?.classList.remove('selected');
    selected = { r, c };
    const td = getCellEl(r, c);
    if (td) { td.classList.add('selected'); td.focus(); }
    const k = key(r, c);
    refBox.textContent = k;
    formulaBar.value = cells[k]?.raw || '';
    updateStatus();
  }

  function updateStatus() {
    const k = key(selected.r, selected.c);
    const val = cells[k]?.val;
    statusEl.textContent = val !== undefined ? String(val) : '';
  }

  // ── Event: click cell ─────────────────────────────────────────────────────
  table.addEventListener('click', e => {
    const td = e.target.closest('td');
    if (!td) return;
    selectCell(Number(td.dataset.r), Number(td.dataset.c));
  });

  // ── Event: keyboard nav ───────────────────────────────────────────────────
  table.addEventListener('keydown', e => {
    const { r, c } = selected;
    if (e.key === 'ArrowRight')  { e.preventDefault(); selectCell(r, c + 1); }
    else if (e.key === 'ArrowLeft')  { e.preventDefault(); selectCell(r, c - 1); }
    else if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); selectCell(r + 1, c); }
    else if (e.key === 'ArrowUp')    { e.preventDefault(); selectCell(r - 1, c); }
    else if (e.key === 'Tab')        { e.preventDefault(); selectCell(r, c + (e.shiftKey ? -1 : 1)); }
    else if (e.key === 'Delete' || e.key === 'Backspace') {
      if (e.target.tagName === 'TD') { setCellRaw(r, c, ''); formulaBar.value = ''; }
    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      formulaBar.value = e.key;
      formulaBar.focus();
    }
  });

  // ── Formula bar ───────────────────────────────────────────────────────────
  formulaBar.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      commitFormula();
      selectCell(selected.r + 1, selected.c);
    } else if (e.key === 'Escape') {
      formulaBar.value = cells[key(selected.r, selected.c)]?.raw || '';
      getCellEl(selected.r, selected.c)?.focus();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      commitFormula();
      selectCell(selected.r, selected.c + (e.shiftKey ? -1 : 1));
    }
  });

  function commitFormula() {
    setCellRaw(selected.r, selected.c, formulaBar.value);
    getCellEl(selected.r, selected.c)?.focus();
  }

  // ── Save / Load ───────────────────────────────────────────────────────────
  function saveDoc() {
    const title = titleEl.textContent.trim() || 'Tabelle1';
    if (!docId) docId = JarvisDB.genId();
    JarvisDB.saveDoc('calc', docId, { title, cells });
    isDirty = false;
    dirtyEl.textContent = '';
    showNotify('Gespeichert: ' + title, 'success');
  }

  function loadDocById(id) {
    const d = JarvisDB.loadDoc('calc', id);
    if (!d) return;
    docId = id;
    titleEl.textContent = d.title || 'Tabelle1';
    cells = d.cells || {};
    // mark all occupied cells dirty
    for (const k of Object.keys(cells)) dirty.add(k);
    flushDirty();
    isDirty = false;
    dirtyEl.textContent = '';
    selectCell(0, 0);
  }

  function newDoc() {
    if (isDirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return;
    docId = null;
    cells = {};
    dirty.clear();
    table.querySelectorAll('td').forEach(td => { td.textContent = ''; td.className = ''; });
    titleEl.textContent = 'Tabelle1';
    isDirty = false;
    dirtyEl.textContent = '';
    selectCell(0, 0);
  }

  function openDocDialog() {
    const docs = JarvisDB.listDocs('calc');
    if (!docs.length) { showNotify('Keine gespeicherten Tabellen.', 'info'); return; }
    const rows = docs.map(d => `
      <div class="doc-row" data-id="${sanitize(d.id)}" tabindex="0" role="button">
        <span class="doc-row-title">${sanitize(d.title)}</span>
        <span class="doc-row-date">${formatDateTime(new Date(d.modified))}</span>
        <button class="btn btn-ghost btn-sm doc-delete" data-id="${sanitize(d.id)}" aria-label="Löschen">${icon('trash', 14)}</button>
      </div>`).join('');
    showModal(`<h3>Tabelle öffnen</h3><div class="doc-list">${rows}</div><div class="modal-actions"><button class="btn btn-ghost btn-cancel">Abbrechen</button></div>`, null);
    container.querySelectorAll('.doc-row').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.doc-delete')) return;
        if (isDirty && !confirm('Verwerfen?')) return;
        loadDocById(row.dataset.id);
        row.closest('.modal-overlay')?.remove();
      });
    });
    container.querySelectorAll('.doc-delete').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Löschen?')) return;
        JarvisDB.deleteDoc('calc', btn.dataset.id);
        btn.closest('.doc-row').remove();
      });
    });
  }

  // ── CSV Export ────────────────────────────────────────────────────────────
  container.querySelector('#calc-export').addEventListener('click', () => {
    const rows = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const v = cells[key(r, c)]?.val ?? '';
        row.push(typeof v === 'string' && v.includes(',') ? `"${v}"` : v);
      }
      // trim trailing empty
      while (row.length && row[row.length - 1] === '') row.pop();
      if (row.length) rows.push(row.join(','));
    }
    downloadFile(rows.join('\n'), (titleEl.textContent.trim() || 'Tabelle') + '.csv', 'text/csv');
  });

  // ── Wiring ────────────────────────────────────────────────────────────────
  container.querySelector('.back-btn').addEventListener('click', () => {
    if (isDirty && !confirm('Verwerfen?')) return;
    goHome();
  });
  container.querySelector('#calc-new').addEventListener('click', newDoc);
  container.querySelector('#calc-open').addEventListener('click', openDocDialog);
  container.querySelector('#calc-save').addEventListener('click', saveDoc);
  container.querySelector('#calc-insert-chart').addEventListener('click', () => showNotify('Diagramm-Funktion folgt in v2.1', 'info'));
  titleEl.addEventListener('input', () => { isDirty = true; dirtyEl.textContent = '● Ungespeichert'; });

  // Ctrl+S
  container.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDoc(); }
  });

  buildTable();
  selectCell(0, 0);
}

  <script>
/* ===== JARVIS OFFICE v2 — MATRIX (Smart-Tabellen) ===== */

function initMatrix(container) {
  let docId = null;
  let isDirty = false;

  const DEFAULT_COLS = [
    { id: 'c1', label: 'Name',    type: 'text'   },
    { id: 'c2', label: 'Status',  type: 'select', options: ['Offen','In Arbeit','Erledigt'] },
    { id: 'c3', label: 'Datum',   type: 'date'   },
    { id: 'c4', label: 'Notiz',   type: 'text'   },
  ];

  let schema = DEFAULT_COLS.map(c => ({ ...c }));
  let rows   = [];

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome matrix-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title" id="matrix-title" contenteditable="true">Matrix1</span>
        <div class="titlebar-actions">
          <button class="btn btn-ghost btn-sm" id="mx-new">${icon('filePlus', 15)} Neu</button>
          <button class="btn btn-ghost btn-sm" id="mx-open">${icon('folderOpen', 15)} Öffnen</button>
          <button class="btn btn-primary btn-sm" id="mx-save">${icon('save', 15)} Speichern</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="btn btn-ghost btn-sm" id="mx-add-row">${icon('plus', 15)} Zeile</button>
          <button class="btn btn-ghost btn-sm" id="mx-add-col">${icon('table', 15)} Spalte</button>
          <button class="btn btn-ghost btn-sm" id="mx-export">${icon('download', 15)} CSV</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <input type="search" id="mx-search" class="tb-search" placeholder="Suchen…" aria-label="Suchen" />
        </div>
      </div>
      <div class="matrix-scroll">
        <table class="matrix-table" id="mx-table" role="grid"></table>
      </div>
      <div class="statusbar">
        <span id="mx-count">0 Einträge</span>
        <span id="mx-dirty"></span>
      </div>
    </div>
  `;

  const tableEl  = container.querySelector('#mx-table');
  const titleEl  = container.querySelector('#matrix-title');
  const dirtyEl  = container.querySelector('#mx-dirty');
  const countEl  = container.querySelector('#mx-count');
  const searchEl = container.querySelector('#mx-search');

  function markDirty() { isDirty = true; dirtyEl.textContent = '● Ungespeichert'; }
  function markClean() { isDirty = false; dirtyEl.textContent = ''; }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(filter = '') {
    const q = filter.toLowerCase();
    const visible = q ? rows.filter(r => Object.values(r.data).some(v => String(v).toLowerCase().includes(q))) : rows;

    let html = '<thead><tr><th></th>';
    schema.forEach(col => {
      html += `<th data-col="${sanitize(col.id)}">${sanitize(col.label)} <button class="col-menu" data-col="${sanitize(col.id)}" title="Spalte bearbeiten">…</button></th>`;
    });
    html += '<th></th></thead><tbody>';

    visible.forEach(row => {
      html += `<tr data-rid="${sanitize(row.id)}"><td class="row-handle">${icon('chevronRight', 12)}</td>`;
      schema.forEach(col => {
        const val = row.data[col.id] ?? '';
        if (col.type === 'select') {
          const opts = (col.options || []).map(o => `<option${o === val ? ' selected' : ''}>${sanitize(o)}</option>`).join('');
          html += `<td><select class="cell-select" data-row="${sanitize(row.id)}" data-col="${sanitize(col.id)}">${opts}</select></td>`;
        } else if (col.type === 'date') {
          html += `<td><input type="date" class="cell-input" value="${sanitize(val)}" data-row="${sanitize(row.id)}" data-col="${sanitize(col.id)}" /></td>`;
        } else {
          html += `<td><input type="text" class="cell-input" value="${sanitize(val)}" data-row="${sanitize(row.id)}" data-col="${sanitize(col.id)}" /></td>`;
        }
      });
      html += `<td><button class="btn-icon row-delete" data-rid="${sanitize(row.id)}" aria-label="Zeile löschen">${icon('trash', 13)}</button></td></tr>`;
    });
    html += '</tbody>';
    tableEl.innerHTML = html;
    countEl.textContent = `${rows.length} Einträge`;
    bindCellEvents();
  }

  function bindCellEvents() {
    tableEl.querySelectorAll('.cell-input, .cell-select').forEach(el => {
      el.addEventListener('change', e => {
        const row = rows.find(r => r.id === e.target.dataset.row);
        if (row) { row.data[e.target.dataset.col] = e.target.value; markDirty(); }
      });
    });
    tableEl.querySelectorAll('.row-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        rows = rows.filter(r => r.id !== btn.dataset.rid);
        markDirty();
        render(searchEl.value);
      });
    });
    tableEl.querySelectorAll('.col-menu').forEach(btn => {
      btn.addEventListener('click', () => editColumn(btn.dataset.col));
    });
  }

  // ── Add row ───────────────────────────────────────────────────────────────
  function addRow() {
    const row = { id: JarvisDB.genId(), data: {} };
    rows.push(row);
    markDirty();
    render(searchEl.value);
  }

  // ── Add / Edit column ─────────────────────────────────────────────────────
  function addColumn() {
    showModal(`
      <h3>Spalte hinzufügen</h3>
      <div class="form-group"><label>Name</label><input type="text" id="col-name" value="Neue Spalte" /></div>
      <div class="form-group">
        <label>Typ</label>
        <select id="col-type">
          <option value="text">Text</option>
          <option value="select">Auswahl</option>
          <option value="date">Datum</option>
        </select>
      </div>
      <div class="form-group" id="col-opts-wrap" style="display:none">
        <label>Optionen (kommagetrennt)</label>
        <input type="text" id="col-opts" placeholder="Option1, Option2" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-cancel">Abbrechen</button>
        <button class="btn btn-primary btn-ok">Hinzufügen</button>
      </div>
    `, (modal) => {
      const label   = modal.querySelector('#col-name').value.trim() || 'Spalte';
      const type    = modal.querySelector('#col-type').value;
      const optsRaw = modal.querySelector('#col-opts').value;
      const options = type === 'select' ? optsRaw.split(',').map(o => o.trim()).filter(Boolean) : undefined;
      schema.push({ id: JarvisDB.genId(), label, type, options });
      markDirty();
      render(searchEl.value);
    });
    // show/hide options field
    setTimeout(() => {
      const typeEl = document.querySelector('#col-type');
      const wrap   = document.querySelector('#col-opts-wrap');
      if (typeEl && wrap) {
        typeEl.addEventListener('change', () => { wrap.style.display = typeEl.value === 'select' ? '' : 'none'; });
      }
    }, 0);
  }

  function editColumn(colId) {
    const col = schema.find(c => c.id === colId);
    if (!col) return;
    showModal(`
      <h3>Spalte bearbeiten</h3>
      <div class="form-group"><label>Name</label><input type="text" id="col-name" value="${sanitize(col.label)}" /></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-cancel">Abbrechen</button>
        <button class="btn btn-danger btn-delete" style="margin-right:auto">Löschen</button>
        <button class="btn btn-primary btn-ok">Speichern</button>
      </div>
    `, (modal) => {
      col.label = modal.querySelector('#col-name').value.trim() || col.label;
      markDirty();
      render(searchEl.value);
    });
    // delete button
    setTimeout(() => {
      document.querySelector('.btn-delete')?.addEventListener('click', () => {
        if (!confirm('Spalte löschen?')) return;
        schema = schema.filter(c => c.id !== colId);
        rows.forEach(r => delete r.data[colId]);
        markDirty();
        render(searchEl.value);
        document.querySelector('.modal-overlay')?.remove();
      });
    }, 0);
  }

  // ── Save / Load ───────────────────────────────────────────────────────────
  function saveDoc() {
    const title = titleEl.textContent.trim() || 'Matrix1';
    if (!docId) docId = JarvisDB.genId();
    JarvisDB.saveDoc('matrix', docId, { title, schema, rows });
    markClean();
    showNotify('Gespeichert: ' + title, 'success');
  }

  function loadDocById(id) {
    const d = JarvisDB.loadDoc('matrix', id);
    if (!d) return;
    docId = id;
    titleEl.textContent = d.title || 'Matrix1';
    schema = d.schema || DEFAULT_COLS;
    rows   = d.rows   || [];
    markClean();
    render();
  }

  function newDoc() {
    if (isDirty && !confirm('Verwerfen?')) return;
    docId = null;
    schema = DEFAULT_COLS.map(c => ({ ...c }));
    rows   = [];
    titleEl.textContent = 'Matrix1';
    markClean();
    render();
  }

  function openDocDialog() {
    const docs = JarvisDB.listDocs('matrix');
    if (!docs.length) { showNotify('Keine Matrizen gefunden.', 'info'); return; }
    const rowsHtml = docs.map(d => `
      <div class="doc-row" data-id="${sanitize(d.id)}" tabindex="0" role="button">
        <span class="doc-row-title">${sanitize(d.title)}</span>
        <span class="doc-row-date">${formatDateTime(new Date(d.modified))}</span>
        <button class="btn btn-ghost btn-sm doc-delete" data-id="${sanitize(d.id)}">${icon('trash', 14)}</button>
      </div>`).join('');
    showModal(`<h3>Matrix öffnen</h3><div class="doc-list">${rowsHtml}</div><div class="modal-actions"><button class="btn btn-ghost btn-cancel">Abbrechen</button></div>`, null);
    container.querySelectorAll('.doc-row').forEach(r => {
      r.addEventListener('click', e => {
        if (e.target.closest('.doc-delete')) return;
        if (isDirty && !confirm('Verwerfen?')) return;
        loadDocById(r.dataset.id);
        r.closest('.modal-overlay')?.remove();
      });
    });
    container.querySelectorAll('.doc-delete').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Löschen?')) return;
        JarvisDB.deleteDoc('matrix', btn.dataset.id);
        btn.closest('.doc-row').remove();
      });
    });
  }

  // ── CSV Export ────────────────────────────────────────────────────────────
  container.querySelector('#mx-export').addEventListener('click', () => {
    const header = schema.map(c => c.label).join(',');
    const body   = rows.map(r => schema.map(c => {
      const v = r.data[c.id] ?? '';
      return v.includes(',') ? `"${v}"` : v;
    }).join(',')).join('\n');
    downloadFile(header + '\n' + body, (titleEl.textContent.trim() || 'Matrix') + '.csv', 'text/csv');
  });

  // ── Wiring ────────────────────────────────────────────────────────────────
  container.querySelector('.back-btn').addEventListener('click', () => {
    if (isDirty && !confirm('Verwerfen?')) return;
    goHome();
  });
  container.querySelector('#mx-new').addEventListener('click', newDoc);
  container.querySelector('#mx-open').addEventListener('click', openDocDialog);
  container.querySelector('#mx-save').addEventListener('click', saveDoc);
  container.querySelector('#mx-add-row').addEventListener('click', addRow);
  container.querySelector('#mx-add-col').addEventListener('click', addColumn);
  searchEl.addEventListener('input', () => render(searchEl.value));
  titleEl.addEventListener('input', markDirty);
  container.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDoc(); }
  });

  render();
}

</script>
  <script>
/* ===== JARVIS OFFICE v2 — DRAW (Vektorgrafik) ===== */

function initDraw(container) {
  let tool = 'select';
  let color = '#7c3aed';
  let strokeWidth = 2;
  let shapes = [];    // { id, type, x, y, w, h, text, fill, stroke, sw, rx }
  let selected = null;
  let dragging = null; // { shape, ox, oy }
  let drawing  = null; // in-progress shape
  let docId = null;
  let isDirty = false;

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome draw-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title" id="draw-title" contenteditable="true">Zeichnung1</span>
        <div class="titlebar-actions">
          <button class="btn btn-ghost btn-sm" id="draw-new">${icon('filePlus', 15)} Neu</button>
          <button class="btn btn-ghost btn-sm" id="draw-open">${icon('folderOpen', 15)} Öffnen</button>
          <button class="btn btn-primary btn-sm" id="draw-save">${icon('save', 15)} Speichern</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-group" role="radiogroup" aria-label="Werkzeug">
          <button class="tb-btn tool-btn active" data-tool="select"  title="Auswählen">${icon('eye', 16)}</button>
          <button class="tb-btn tool-btn"         data-tool="rect"   title="Rechteck">▭</button>
          <button class="tb-btn tool-btn"         data-tool="ellipse"title="Ellipse">◯</button>
          <button class="tb-btn tool-btn"         data-tool="line"   title="Linie">╱</button>
          <button class="tb-btn tool-btn"         data-tool="text"   title="Text">T</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <label class="tb-label" for="draw-color">Farbe</label>
          <input type="color" id="draw-color" value="${color}" class="tb-color" aria-label="Farbe" />
          <label class="tb-label" for="draw-sw">Strich</label>
          <input type="range" id="draw-sw" min="1" max="20" value="${strokeWidth}" class="tb-range" aria-label="Strichbreite" style="width:70px" />
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button class="btn btn-ghost btn-sm" id="draw-delete-sel" disabled>${icon('trash', 15)} Löschen</button>
          <button class="btn btn-ghost btn-sm" id="draw-export">${icon('download', 15)} SVG</button>
        </div>
      </div>
      <div class="draw-scroll">
        <svg id="draw-canvas" class="draw-canvas" tabindex="0"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="Zeichenfläche"
             role="application"></svg>
      </div>
      <div class="statusbar">
        <span id="draw-info">Werkzeug: Auswählen</span>
        <span id="draw-dirty"></span>
      </div>
    </div>
  `;

  const svg      = container.querySelector('#draw-canvas');
  const titleEl  = container.querySelector('#draw-title');
  const dirtyEl  = container.querySelector('#draw-dirty');
  const infoEl   = container.querySelector('#draw-info');
  const colorIn  = container.querySelector('#draw-color');
  const swIn     = container.querySelector('#draw-sw');
  const delBtn   = container.querySelector('#draw-delete-sel');

  function markDirty() { isDirty = true; dirtyEl.textContent = '● Ungespeichert'; }
  function markClean() { isDirty = false; dirtyEl.textContent = ''; }

  // ── SVG helpers ───────────────────────────────────────────────────────────
  function svgEl(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  function shapeToEl(s) {
    let el;
    if (s.type === 'rect') {
      el = svgEl('rect', { x: s.x, y: s.y, width: s.w, height: s.h,
        fill: s.fill || 'none', stroke: s.stroke, 'stroke-width': s.sw, rx: s.rx || 4 });
    } else if (s.type === 'ellipse') {
      el = svgEl('ellipse', { cx: s.x + s.w / 2, cy: s.y + s.h / 2, rx: s.w / 2, ry: s.h / 2,
        fill: s.fill || 'none', stroke: s.stroke, 'stroke-width': s.sw });
    } else if (s.type === 'line') {
      el = svgEl('line', { x1: s.x, y1: s.y, x2: s.x + s.w, y2: s.y + s.h,
        stroke: s.stroke, 'stroke-width': s.sw, 'stroke-linecap': 'round' });
    } else if (s.type === 'text') {
      el = svgEl('text', { x: s.x, y: s.y, fill: s.stroke, 'font-size': 16,
        'font-family': 'var(--font-sans)' });
      el.textContent = s.text || '';
    } else return null;
    el.dataset.id = s.id;
    el.style.cursor = tool === 'select' ? 'move' : 'crosshair';
    return el;
  }

  function renderAll() {
    // keep defs if any
    const existing = new Map();
    svg.querySelectorAll('[data-id]').forEach(e => existing.set(e.dataset.id, e));

    // remove deleted
    for (const [id, el] of existing) {
      if (!shapes.find(s => s.id === id)) el.remove();
    }

    // add/update
    shapes.forEach(s => {
      const oldEl = existing.get(s.id);
      const newEl = shapeToEl(s);
      if (!newEl) return;
      newEl.classList.toggle('selected-shape', s.id === selected);
      if (oldEl) oldEl.replaceWith(newEl);
      else svg.appendChild(newEl);
    });
  }

  // ── Pointer events ────────────────────────────────────────────────────────
  function svgCoords(e) {
    const rect = svg.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  svg.addEventListener('pointerdown', e => {
    if (tool === 'select') {
      const target = e.target.closest('[data-id]');
      if (target) {
        selected = target.dataset.id;
        const s = shapes.find(sh => sh.id === selected);
        dragging = { shape: s, ox: e.clientX - s.x, oy: e.clientY - s.y };
        delBtn.disabled = false;
        renderAll();
      } else {
        selected = null; delBtn.disabled = true; renderAll();
      }
      return;
    }
    if (tool === 'text') {
      const { x, y } = svgCoords(e);
      showModal(`
        <h3>Text eingeben</h3>
        <div class="form-group"><input type="text" id="text-input" value="" placeholder="Text…" /></div>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-cancel">Abbrechen</button>
          <button class="btn btn-primary btn-ok">Einfügen</button>
        </div>
      `, (modal) => {
        const t = modal.querySelector('#text-input').value;
        if (!t) return;
        shapes.push({ id: JarvisDB.genId(), type: 'text', x, y, w: 0, h: 0, text: t, stroke: color, sw: strokeWidth });
        markDirty(); renderAll();
      });
      return;
    }
    const { x, y } = svgCoords(e);
    drawing = { id: JarvisDB.genId(), type: tool, x, y, w: 0, h: 0, stroke: color, sw: strokeWidth, fill: 'none' };
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener('pointermove', e => {
    if (dragging) {
      dragging.shape.x = e.clientX - dragging.ox;
      dragging.shape.y = e.clientY - dragging.oy;
      markDirty(); renderAll();
    } else if (drawing) {
      const { x, y } = svgCoords(e);
      drawing.w = x - drawing.x;
      drawing.h = y - drawing.y;
      // preview
      let preview = svg.querySelector('#draw-preview');
      if (!preview) {
        preview = shapeToEl({ ...drawing, id: 'draw-preview' });
        if (preview) { preview.id = 'draw-preview'; preview.dataset.id = ''; svg.appendChild(preview); }
      } else {
        const fresh = shapeToEl({ ...drawing, id: 'draw-preview' });
        if (fresh) { fresh.id = 'draw-preview'; fresh.dataset.id = ''; preview.replaceWith(fresh); }
      }
    }
  });

  svg.addEventListener('pointerup', () => {
    dragging = null;
    if (drawing) {
      svg.querySelector('#draw-preview')?.remove();
      if (Math.abs(drawing.w) > 3 || Math.abs(drawing.h) > 3) {
        shapes.push({ ...drawing });
        markDirty(); renderAll();
      }
      drawing = null;
    }
  });

  // ── Toolbar wiring ────────────────────────────────────────────────────────
  container.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
      infoEl.textContent = `Werkzeug: ${btn.title || tool}`;
      svg.style.cursor = tool === 'select' ? 'default' : 'crosshair';
    });
  });

  colorIn.addEventListener('input', () => { color = colorIn.value; });
  swIn.addEventListener('input', () => { strokeWidth = Number(swIn.value); });

  delBtn.addEventListener('click', () => {
    if (!selected) return;
    shapes = shapes.filter(s => s.id !== selected);
    selected = null; delBtn.disabled = true;
    markDirty(); renderAll();
  });

  container.querySelector('#draw-export').addEventListener('click', () => {
    const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">${svg.innerHTML}</svg>`;
    downloadFile(svgStr, (titleEl.textContent.trim() || 'Zeichnung') + '.svg', 'image/svg+xml');
  });

  // ── Save / Load ───────────────────────────────────────────────────────────
  function saveDoc() {
    const title = titleEl.textContent.trim() || 'Zeichnung1';
    if (!docId) docId = JarvisDB.genId();
    JarvisDB.saveDoc('draw', docId, { title, shapes });
    markClean();
    showNotify('Gespeichert: ' + title, 'success');
  }

  function loadDocById(id) {
    const d = JarvisDB.loadDoc('draw', id);
    if (!d) return;
    docId = id; titleEl.textContent = d.title || 'Zeichnung1';
    shapes = d.shapes || [];
    markClean(); renderAll();
  }

  function newDoc() {
    if (isDirty && !confirm('Verwerfen?')) return;
    docId = null; shapes = []; titleEl.textContent = 'Zeichnung1';
    markClean(); renderAll();
  }

  function openDocDialog() {
    const docs = JarvisDB.listDocs('draw');
    if (!docs.length) { showNotify('Keine Zeichnungen.', 'info'); return; }
    const rowsHtml = docs.map(d => `
      <div class="doc-row" data-id="${sanitize(d.id)}" tabindex="0" role="button">
        <span class="doc-row-title">${sanitize(d.title)}</span>
        <span class="doc-row-date">${formatDateTime(new Date(d.modified))}</span>
        <button class="btn btn-ghost btn-sm doc-delete" data-id="${sanitize(d.id)}">${icon('trash', 14)}</button>
      </div>`).join('');
    showModal(`<h3>Zeichnung öffnen</h3><div class="doc-list">${rowsHtml}</div><div class="modal-actions"><button class="btn btn-ghost btn-cancel">Abbrechen</button></div>`, null);
    container.querySelectorAll('.doc-row').forEach(r => {
      r.addEventListener('click', e => {
        if (e.target.closest('.doc-delete')) return;
        if (isDirty && !confirm('Verwerfen?')) return;
        loadDocById(r.dataset.id); r.closest('.modal-overlay')?.remove();
      });
    });
    container.querySelectorAll('.doc-delete').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Löschen?')) return;
        JarvisDB.deleteDoc('draw', btn.dataset.id);
        btn.closest('.doc-row').remove();
      });
    });
  }

  container.querySelector('.back-btn').addEventListener('click', () => {
    if (isDirty && !confirm('Verwerfen?')) return; goHome();
  });
  container.querySelector('#draw-new').addEventListener('click', newDoc);
  container.querySelector('#draw-open').addEventListener('click', openDocDialog);
  container.querySelector('#draw-save').addEventListener('click', saveDoc);
  titleEl.addEventListener('input', markDirty);
  container.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDoc(); }
    if (e.key === 'Delete' && selected) delBtn.click();
  });

  renderAll();
}

</script>
