      </div>
      <div class="statusbar">
        <span id="pres-counter">Folie 1 / 1</span>
        <span id="pres-dirty"></span>
      </div>
    </div>
    <div class="present-fullscreen hidden" id="pres-fs" tabindex="0" role="dialog" aria-modal="true" aria-label="Präsentation">
      <div class="pres-fs-slide" id="pres-fs-slide"></div>
      <div class="pres-fs-controls">
        <button class="btn btn-ghost" id="fs-prev">${icon('chevronLeft', 20)}</button>
        <span id="fs-counter">1 / 1</span>
        <button class="btn btn-ghost" id="fs-next">${icon('chevronRight', 20)}</button>
        <button class="btn btn-ghost" id="fs-exit">${icon('x', 18)} Beenden</button>
      </div>
    </div>
  `;

  const slidePanel   = container.querySelector('#slide-panel');
  const preview      = container.querySelector('#slide-preview');
  const titleInEl    = container.querySelector('#slide-title-in');
  const contentInEl  = container.querySelector('#slide-content-in');
  const titleEl      = container.querySelector('#pres-title');
  const dirtyEl      = container.querySelector('#pres-dirty');
  const counterEl    = container.querySelector('#pres-counter');
  const bgIn         = container.querySelector('#pres-bg');
  const fcIn         = container.querySelector('#pres-fc');
  const layoutSel    = container.querySelector('#pres-layout');
  const fsEl         = container.querySelector('#pres-fs');
  const fsSlide      = container.querySelector('#pres-fs-slide');
  const fsCounter    = container.querySelector('#fs-counter');

  function markDirty() { isDirty = true; dirtyEl.textContent = '● Ungespeichert'; }
  function markClean() { isDirty = false; dirtyEl.textContent = ''; }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderSlideThumb(s, idx) {
    const div = document.createElement('div');
    div.className = 'slide-thumb' + (idx === current ? ' active' : '');
    div.setAttribute('role', 'listitem');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', `Folie ${idx + 1}: ${s.title}`);
    div.dataset.idx = idx;
    div.innerHTML = `<div class="thumb-inner" style="background:${s.bg};color:${s.color}">
      <strong>${sanitize(s.title)}</strong>
    </div>
    <span class="thumb-num">${idx + 1}</span>`;
    div.addEventListener('click', () => selectSlide(idx));
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') selectSlide(idx); });
    return div;
  }

  function renderPanel() {
    slidePanel.innerHTML = '';
    slides.forEach((s, i) => slidePanel.appendChild(renderSlideThumb(s, i)));
  }

  function renderPreview() {
    const s = slides[current];
    preview.style.background = s.bg;
    preview.style.color = s.color;
    preview.style.textAlign = s.layout === 'left' ? 'left' : 'center';
    preview.innerHTML = `<h2 class="slide-prev-title">${sanitize(s.title)}</h2>
      <p class="slide-prev-content">${sanitize(s.content).replace(/\n/g, '<br>')}</p>`;
    counterEl.textContent = `Folie ${current + 1} / ${slides.length}`;
    bgIn.value = s.bg;
    fcIn.value = s.color;
    layoutSel.value = s.layout || 'center';
    titleInEl.value  = s.title;
    contentInEl.value = s.content;
  }

  function selectSlide(idx) {
    current = Math.max(0, Math.min(idx, slides.length - 1));
    renderPanel();
    renderPreview();
  }

  // ── Fields sync ───────────────────────────────────────────────────────────
  titleInEl.addEventListener('input',   () => { slides[current].title   = titleInEl.value;   markDirty(); renderPanel(); renderPreview(); });
  contentInEl.addEventListener('input', () => { slides[current].content = contentInEl.value; markDirty(); renderPreview(); });
  bgIn.addEventListener('input',    () => { slides[current].bg     = bgIn.value;    markDirty(); renderPreview(); });
  fcIn.addEventListener('input',    () => { slides[current].color  = fcIn.value;    markDirty(); renderPreview(); });
  layoutSel.addEventListener('change', () => { slides[current].layout = layoutSel.value; markDirty(); renderPreview(); });

  // ── Slide management ──────────────────────────────────────────────────────
  container.querySelector('#pres-add-slide').addEventListener('click', () => {
    const newSlide = { id: JarvisDB.genId(), title: `Folie ${slides.length + 1}`, content: '', bg: '#1e1b4b', color: '#ffffff', layout: 'center' };
    slides.splice(current + 1, 0, newSlide);
    selectSlide(current + 1);
    markDirty();
  });

  container.querySelector('#pres-del-slide').addEventListener('click', () => {
    if (slides.length <= 1) { showNotify('Mindestens eine Folie erforderlich.', 'warn'); return; }
    if (!confirm('Folie löschen?')) return;
    slides.splice(current, 1);
    selectSlide(Math.min(current, slides.length - 1));
    markDirty();
  });

  container.querySelector('#pres-move-up').addEventListener('click', () => {
    if (current <= 0) return;
    [slides[current], slides[current - 1]] = [slides[current - 1], slides[current]];
    selectSlide(current - 1);
    markDirty();
  });

  container.querySelector('#pres-move-down').addEventListener('click', () => {
    if (current >= slides.length - 1) return;
    [slides[current], slides[current + 1]] = [slides[current + 1], slides[current]];
    selectSlide(current + 1);
    markDirty();
  });

  // ── Fullscreen presentation ───────────────────────────────────────────────
  function renderFsSlide(idx) {
    const s = slides[idx];
    fsSlide.style.background = s.bg;
    fsSlide.style.color = s.color;
    fsSlide.style.textAlign = s.layout === 'left' ? 'left' : 'center';
    fsSlide.innerHTML = `<h1 class="fs-title">${sanitize(s.title)}</h1>
      <p class="fs-content">${sanitize(s.content).replace(/\n/g, '<br>')}</p>`;
    fsCounter.textContent = `${idx + 1} / ${slides.length}`;
  }

  container.querySelector('#pres-start').addEventListener('click', () => {
    presenting = true;
    fsEl.classList.remove('hidden');
    renderFsSlide(current);
    fsEl.focus();
  });

  container.querySelector('#fs-exit').addEventListener('click', () => {
    presenting = false; fsEl.classList.add('hidden');
  });

  container.querySelector('#fs-prev').addEventListener('click', () => {
    if (current > 0) { current--; renderFsSlide(current); }
  });
  container.querySelector('#fs-next').addEventListener('click', () => {
    if (current < slides.length - 1) { current++; renderFsSlide(current); }
  });

  fsEl.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      if (current < slides.length - 1) { current++; renderFsSlide(current); }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (current > 0) { current--; renderFsSlide(current); }
    } else if (e.key === 'Escape') {
      presenting = false; fsEl.classList.add('hidden');
    }
  });

  // ── Save / Load ───────────────────────────────────────────────────────────
  function saveDoc() {
    const title = titleEl.textContent.trim() || 'Präsentation1';
    if (!docId) docId = JarvisDB.genId();
    JarvisDB.saveDoc('present', docId, { title, slides });
    markClean();
    showNotify('Gespeichert: ' + title, 'success');
  }

  function loadDocById(id) {
    const d = JarvisDB.loadDoc('present', id);
    if (!d) return;
    docId = id; titleEl.textContent = d.title || 'Präsentation1';
    slides = d.slides || slides;
    markClean(); selectSlide(0);
  }

  function newDoc() {
    if (isDirty && !confirm('Verwerfen?')) return;
    docId = null;
    slides = [{ id: JarvisDB.genId(), title: 'Folie 1', content: '', bg: '#1e1b4b', color: '#ffffff', layout: 'center' }];
    titleEl.textContent = 'Präsentation1';
    markClean(); selectSlide(0);
  }

  function openDocDialog() {
    const docs = JarvisDB.listDocs('present');
    if (!docs.length) { showNotify('Keine Präsentationen.', 'info'); return; }
    const rowsHtml = docs.map(d => `
      <div class="doc-row" data-id="${sanitize(d.id)}" tabindex="0" role="button">
        <span class="doc-row-title">${sanitize(d.title)}</span>
        <span class="doc-row-date">${formatDateTime(new Date(d.modified))}</span>
        <button class="btn btn-ghost btn-sm doc-delete" data-id="${sanitize(d.id)}">${icon('trash', 14)}</button>
      </div>`).join('');
    showModal(`<h3>Präsentation öffnen</h3><div class="doc-list">${rowsHtml}</div><div class="modal-actions"><button class="btn btn-ghost btn-cancel">Abbrechen</button></div>`, null);
    container.querySelectorAll('.doc-row').forEach(r => {
      r.addEventListener('click', e => {
        if (e.target.closest('.doc-delete')) return;
        if (isDirty && !confirm('Verwerfen?')) return;
        loadDocById(r.dataset.id); r.closest('.modal-overlay')?.remove();
      });
    });
    container.querySelectorAll('.doc-delete').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm('Löschen?')) return;
        JarvisDB.deleteDoc('present', btn.dataset.id);
        btn.closest('.doc-row').remove();
      });
    });
  }

  container.querySelector('.back-btn').addEventListener('click', () => {
    if (isDirty && !confirm('Verwerfen?')) return; goHome();
  });
  container.querySelector('#pres-new').addEventListener('click', newDoc);
  container.querySelector('#pres-open').addEventListener('click', openDocDialog);
  container.querySelector('#pres-save').addEventListener('click', saveDoc);
  titleEl.addEventListener('input', markDirty);
  container.addEventListener('keydown', e => {
    if (!presenting && (e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDoc(); }
  });

  selectSlide(0);
}

</script>
  <script>
/* ===== JARVIS OFFICE v2 — MAIL ===== */

function initMail(container) {
  // Offline mail client — stores messages in localStorage only
  let messages = JarvisDB.get('mail_messages', []);
  let selected = null;
  let currentFolder = 'inbox';

  const FOLDERS = [
    { id: 'inbox',  label: 'Eingang',   icon: 'mail'    },
    { id: 'sent',   label: 'Gesendet',  icon: 'forward' },
    { id: 'drafts', label: 'Entwürfe',  icon: 'save'    },
    { id: 'trash',  label: 'Papierkorb',icon: 'trash'   },
  ];

  // Seed demo messages if empty
  if (!messages.length) {
    messages = [
      { id: JarvisDB.genId(), folder: 'inbox', from: 'jarvis@office.local', to: 'ich@lokal', subject: 'Willkommen bei Jarvis Mail', body: 'Das ist dein lokaler Mail-Client.\n\nNachrichten bleiben auf diesem Gerät.', date: Date.now(), read: false },
    ];
    saveMail();
  }

  function saveMail() { JarvisDB.set('mail_messages', messages); }

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome mail-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title">Jarvis Mail</span>
        <div class="titlebar-actions">
          <button class="btn btn-primary btn-sm" id="mail-compose">${icon('filePlus', 15)} Neue Mail</button>
        </div>
      </div>
      <div class="mail-layout">
        <nav class="mail-sidebar" role="navigation" aria-label="Ordner">
          ${FOLDERS.map(f => `
            <button class="folder-btn${f.id === currentFolder ? ' active' : ''}" data-folder="${f.id}">
              ${icon(f.icon, 15)} ${f.label}
              <span class="folder-badge" id="badge-${f.id}"></span>
            </button>`).join('')}
        </nav>
        <div class="mail-list-area">
          <div class="mail-list" id="mail-list" role="list" aria-label="Nachrichten"></div>
          <div class="mail-detail" id="mail-detail" aria-live="polite"></div>
        </div>
      </div>
      <div class="statusbar">
        <span id="mail-status">Bereit</span>
      </div>
    </div>
  `;

  const mailList   = container.querySelector('#mail-list');
  const mailDetail = container.querySelector('#mail-detail');
  const statusEl   = container.querySelector('#mail-status');

  // ── Badges ────────────────────────────────────────────────────────────────
  function updateBadges() {
    FOLDERS.forEach(f => {
      const unread = messages.filter(m => m.folder === f.id && !m.read).length;
      const badge = container.querySelector(`#badge-${f.id}`);
      if (badge) { badge.textContent = unread || ''; badge.style.display = unread ? '' : 'none'; }
    });
  }

  // ── Render list ───────────────────────────────────────────────────────────
  function renderList() {
    const folderMsgs = messages.filter(m => m.folder === currentFolder)
      .sort((a, b) => b.date - a.date);
    mailList.innerHTML = '';
    if (!folderMsgs.length) {
      mailList.innerHTML = '<div class="mail-empty">Keine Nachrichten.</div>';
      mailDetail.innerHTML = '';
      return;
    }
    folderMsgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'mail-item' + (m.read ? '' : ' unread') + (m.id === selected ? ' selected' : '');
      div.setAttribute('role', 'listitem');
      div.setAttribute('tabindex', '0');
      div.innerHTML = `
        <div class="mail-from">${sanitize(m.from)}</div>
        <div class="mail-subject">${sanitize(m.subject)}</div>
        <div class="mail-date">${formatDateTime(new Date(m.date))}</div>
      `;
      div.addEventListener('click', () => openMessage(m.id));
      div.addEventListener('keydown', e => { if (e.key === 'Enter') openMessage(m.id); });
      mailList.appendChild(div);
    });
    statusEl.textContent = `${folderMsgs.length} Nachrichten`;
    updateBadges();
  }

  // ── Open message ──────────────────────────────────────────────────────────
  function openMessage(id) {
    selected = id;
    const m = messages.find(msg => msg.id === id);
    if (!m) return;
    m.read = true;
    saveMail();
    renderList();
    mailDetail.innerHTML = `
      <div class="mail-detail-header">
        <div class="mail-detail-subject">${sanitize(m.subject)}</div>
        <div class="mail-detail-meta">
          <span>Von: ${sanitize(m.from)}</span>
          <span>An: ${sanitize(m.to)}</span>
          <span>${formatDateTime(new Date(m.date))}</span>
        </div>
        <div class="mail-detail-actions">
          <button class="btn btn-ghost btn-sm" id="mail-reply">${icon('reply', 14)} Antworten</button>
          <button class="btn btn-ghost btn-sm" id="mail-forward">${icon('forward', 14)} Weiterleiten</button>
          <button class="btn btn-ghost btn-sm" id="mail-trash-msg">${icon('trash', 14)} Löschen</button>
        </div>
      </div>
      <div class="mail-body">${sanitize(m.body).replace(/\n/g, '<br>')}</div>
    `;
    container.querySelector('#mail-reply')?.addEventListener('click', () => composeReply(m));
    container.querySelector('#mail-forward')?.addEventListener('click', () => composeForward(m));
    container.querySelector('#mail-trash-msg')?.addEventListener('click', () => trashMsg(m.id));
  }

  function trashMsg(id) {
    const m = messages.find(msg => msg.id === id);
    if (!m) return;
    if (m.folder === 'trash') {
      if (!confirm('Endgültig löschen?')) return;
      messages = messages.filter(msg => msg.id !== id);
    } else {
      m.folder = 'trash';
    }
    selected = null;
    saveMail();
    mailDetail.innerHTML = '';
    renderList();
  }

  // ── Compose ───────────────────────────────────────────────────────────────
  function openCompose({ to = '', subject = '', body = '', replyTo = null } = {}) {
    showModal(`
      <h3>Neue Nachricht</h3>
      <div class="form-group"><label>An</label><input type="email" id="comp-to" value="${sanitize(to)}" placeholder="empfaenger@example.com" /></div>
      <div class="form-group"><label>Betreff</label><input type="text" id="comp-subject" value="${sanitize(subject)}" /></div>
      <div class="form-group"><label>Nachricht</label><textarea id="comp-body" rows="8" style="resize:vertical">${sanitize(body)}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-cancel">Abbrechen</button>
        <button class="btn btn-ghost btn-draft">Entwurf</button>
        <button class="btn btn-primary btn-ok">Senden</button>
      </div>
    `, (modal) => {
      const msg = {
        id: JarvisDB.genId(),
        folder: 'sent',
        from: 'ich@lokal',
        to:   modal.querySelector('#comp-to').value.trim(),
        subject: modal.querySelector('#comp-subject').value.trim() || '(kein Betreff)',
        body: modal.querySelector('#comp-body').value,
        date: Date.now(),
        read: true,
      };
      if (!msg.to) { showNotify('Bitte einen Empfänger angeben.', 'warn'); return; }
      messages.push(msg);
      if (replyTo) { const orig = messages.find(m => m.id === replyTo); if (orig) orig.replied = true; }
      saveMail();
      renderList();
      showNotify('Gesendet.', 'success');
    });

    // Draft button
    setTimeout(() => {
      document.querySelector('.btn-draft')?.addEventListener('click', () => {
        const modal = document.querySelector('.modal');
        if (!modal) return;
        const msg = {
          id: JarvisDB.genId(), folder: 'drafts', from: 'ich@lokal',
          to:      modal.querySelector('#comp-to').value.trim(),
          subject: modal.querySelector('#comp-subject').value.trim() || '(kein Betreff)',
          body:    modal.querySelector('#comp-body').value,
          date: Date.now(), read: true,
        };
        messages.push(msg); saveMail(); renderList();
        document.querySelector('.modal-overlay')?.remove();
        showNotify('Als Entwurf gespeichert.', 'info');
      });
    }, 0);
  }

  function composeReply(orig) {
    openCompose({
      to: orig.from,
      subject: orig.subject.startsWith('Re:') ? orig.subject : 'Re: ' + orig.subject,
      body: `\n\n--- Original ---\nVon: ${orig.from}\n${orig.body}`,
      replyTo: orig.id,
    });
  }

  function composeForward(orig) {
    openCompose({
      subject: orig.subject.startsWith('Fwd:') ? orig.subject : 'Fwd: ' + orig.subject,
      body: `\n\n--- Weitergeleitet von ${orig.from} ---\n${orig.body}`,
    });
  }

  // ── Folder nav ────────────────────────────────────────────────────────────
  container.querySelectorAll('.folder-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFolder = btn.dataset.folder;
      selected = null;
      mailDetail.innerHTML = '';
      renderList();
    });
  });

  container.querySelector('#mail-compose').addEventListener('click', () => openCompose());
  container.querySelector('.back-btn').addEventListener('click', goHome);

  updateBadges();
  renderList();
}

</script>
  <script>
/* ===== JARVIS OFFICE v2 — NOTES ===== */

function initNotes(container) {
  let notes = JarvisDB.get('notes_list', []);
  let selectedId = null;
  let saveTimer = null;

  if (!notes.length) {
    notes = [{ id: JarvisDB.genId(), title: 'Erste Notiz', content: 'Hier steht deine erste Notiz.', modified: Date.now(), pinned: false }];
    persist();
  }

  function persist() { JarvisDB.set('notes_list', notes); }

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome notes-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title">Jarvis Notes</span>
        <div class="titlebar-actions">
          <button class="btn btn-primary btn-sm" id="notes-new">${icon('plus', 15)} Neue Notiz</button>
        </div>
      </div>
      <div class="notes-layout">
        <div class="notes-sidebar">
          <div class="notes-search-wrap">
            <input type="search" id="notes-search" placeholder="Suchen…" aria-label="Notizen durchsuchen" />
          </div>
          <div class="notes-list" id="notes-list" role="list" aria-label="Notizen"></div>
        </div>
        <div class="notes-editor-area">
          <div class="notes-toolbar">
            <input type="text" id="notes-title-in" class="notes-title-in" placeholder="Titel" aria-label="Notiz-Titel" />
            <button class="btn-icon" id="notes-pin" title="Anheften">${icon('pin', 16)}</button>
            <button class="btn-icon" id="notes-delete" title="Löschen">${icon('trash', 16)}</button>
            <button class="btn btn-ghost btn-sm" id="notes-export">${icon('download', 14)} TXT</button>
          </div>
          <textarea id="notes-content" class="notes-content" placeholder="Notiz beginnen…" aria-label="Notizinhalt"></textarea>
        </div>
      </div>
      <div class="statusbar">
        <span id="notes-count">0 Notizen</span>
        <span id="notes-saved"></span>
      </div>
    </div>
  `;

  const listEl    = container.querySelector('#notes-list');
  const titleIn   = container.querySelector('#notes-title-in');
  const contentEl = container.querySelector('#notes-content');
  const searchEl  = container.querySelector('#notes-search');
  const countEl   = container.querySelector('#notes-count');
  const savedEl   = container.querySelector('#notes-saved');
  const pinBtn    = container.querySelector('#notes-pin');

  // ── Helpers ───────────────────────────────────────────────────────────────
  function currentNote() { return notes.find(n => n.id === selectedId) || null; }

  function sorted(list) {
    return [...list].sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.modified - a.modified;
    });
  }

  function filtered(q) {
    if (!q) return sorted(notes);
    const lq = q.toLowerCase();
    return sorted(notes.filter(n => n.title.toLowerCase().includes(lq) || n.content.toLowerCase().includes(lq)));
  }

  // ── Render list ───────────────────────────────────────────────────────────
  function renderList(q = '') {
    const vis = filtered(q);
    listEl.innerHTML = '';
    countEl.textContent = `${notes.length} Notiz${notes.length !== 1 ? 'en' : ''}`;
    vis.forEach(n => {
      const div = document.createElement('div');
      div.className = 'note-item' + (n.id === selectedId ? ' active' : '') + (n.pinned ? ' pinned' : '');
      div.setAttribute('role', 'listitem');
      div.setAttribute('tabindex', '0');
      div.innerHTML = `
        <div class="note-item-title">${sanitize(n.title) || '(kein Titel)'}${n.pinned ? ' ' + icon('pin', 11) : ''}</div>
        <div class="note-item-preview">${sanitize(n.content.slice(0, 60))}</div>
        <div class="note-item-date">${formatDate(new Date(n.modified))}</div>
      `;
      div.addEventListener('click', () => selectNote(n.id));
      div.addEventListener('keydown', e => { if (e.key === 'Enter') selectNote(n.id); });
      listEl.appendChild(div);
    });
  }

  // ── Select note ───────────────────────────────────────────────────────────
  function selectNote(id) {
    selectedId = id;
    const n = currentNote();
    if (!n) return;
    titleIn.value    = n.title;
    contentEl.value  = n.content;
    pinBtn.classList.toggle('active', !!n.pinned);
    renderList(searchEl.value);
    contentEl.focus();
  }

  // ── Auto-save ─────────────────────────────────────────────────────────────
  function scheduleAutoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1000);
  }

  function doSave() {
    const n = currentNote();
    if (!n) return;
    n.title    = titleIn.value;
    n.content  = contentEl.value;
    n.modified = Date.now();
    persist();
    savedEl.textContent = 'Gespeichert';
    setTimeout(() => { savedEl.textContent = ''; }, 1500);
    renderList(searchEl.value);
  }

  titleIn.addEventListener('input',   scheduleAutoSave);
  contentEl.addEventListener('input', scheduleAutoSave);

  // ── New note ──────────────────────────────────────────────────────────────
  function newNote() {
    const n = { id: JarvisDB.genId(), title: 'Neue Notiz', content: '', modified: Date.now(), pinned: false };
    notes.unshift(n);
    persist();
    selectNote(n.id);
    titleIn.select();
  }

  // ── Delete ────────────────────────────────────────────────────────────────
  function deleteNote() {
    if (!selectedId) return;
    if (!confirm('Notiz löschen?')) return;
    notes = notes.filter(n => n.id !== selectedId);
    persist();
    selectedId = notes.length ? notes[0].id : null;
    if (selectedId) selectNote(selectedId);
    else { titleIn.value = ''; contentEl.value = ''; renderList(); }
  }

  // ── Pin ───────────────────────────────────────────────────────────────────
  function togglePin() {
    const n = currentNote();
    if (!n) return;
    n.pinned = !n.pinned;
    n.modified = Date.now();
    persist();
    pinBtn.classList.toggle('active', n.pinned);
    renderList(searchEl.value);
  }

  // ── Export ────────────────────────────────────────────────────────────────
  container.querySelector('#notes-export').addEventListener('click', () => {
    const n = currentNote();
    if (!n) return;
    downloadFile(n.title + '\n' + '='.repeat(n.title.length) + '\n\n' + n.content,
      (n.title || 'Notiz') + '.txt', 'text/plain');
  });

  // ── Wiring ────────────────────────────────────────────────────────────────
  container.querySelector('#notes-new').addEventListener('click', newNote);
  container.querySelector('#notes-delete').addEventListener('click', deleteNote);
  pinBtn.addEventListener('click', togglePin);
  searchEl.addEventListener('input', () => renderList(searchEl.value));
  container.querySelector('.back-btn').addEventListener('click', () => {
    clearTimeout(saveTimer); doSave(); goHome();
  });

  selectNote(notes[0].id);
}

</script>
  <script>
/* ===== JARVIS OFFICE v2 — CALENDAR ===== */

function initCalendar(container) {
  let events = JarvisDB.get('cal_events', []);
  let viewDate = new Date();
  let view = 'month'; // month | week | day

  function persist() { JarvisDB.set('cal_events', events); }

  const DOW = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  // ── DOM ──────────────────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="app-chrome cal-app">
      <div class="titlebar">
        <button class="btn-icon back-btn" aria-label="Zurück">${icon('arrowLeft', 18)}</button>
        <span class="app-title">Jarvis Calendar</span>
        <div class="titlebar-actions">
          <button class="btn btn-primary btn-sm" id="cal-new-event">${icon('plus', 15)} Termin</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="btn btn-ghost btn-sm" id="cal-prev">${icon('chevronLeft', 15)}</button>
          <button class="btn btn-ghost btn-sm" id="cal-today">Heute</button>
          <button class="btn btn-ghost btn-sm" id="cal-next">${icon('chevronRight', 15)}</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group" role="radiogroup" aria-label="Ansicht">
          <button class="btn btn-ghost btn-sm view-btn active" data-view="month">Monat</button>
          <button class="btn btn-ghost btn-sm view-btn" data-view="week">Woche</button>
          <button class="btn btn-ghost btn-sm view-btn" data-view="day">Tag</button>
        </div>
      </div>
      <div class="cal-title-bar" id="cal-title-bar"></div>
      <div class="cal-body" id="cal-body" role="grid" aria-label="Kalender"></div>
      <div class="statusbar">
        <span id="cal-event-count">0 Termine</span>
      </div>
    </div>
  `;

  const titleBar = container.querySelector('#cal-title-bar');
  const body     = container.querySelector('#cal-body');
  const countEl  = container.querySelector('#cal-event-count');

  // ── Date helpers ──────────────────────────────────────────────────────────
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function isToday(d) { return isoDate(d) === isoDate(new Date()); }
  function eventsOnDay(dateStr) { return events.filter(e => e.date === dateStr); }

  // ── Render month ──────────────────────────────────────────────────────────
  function renderMonth() {
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    titleBar.textContent = `${MONTHS[m]} ${y}`;
    body.className = 'cal-body cal-month';

    // day-of-week headers
    let html = '<div class="cal-grid">';
    DOW.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

    const first = new Date(y, m, 1);
    let dow = (first.getDay() + 6) % 7; // Mon=0
    for (let i = 0; i < dow; i++) html += '<div class="cal-day other"></div>';

    const days = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m, d);
      const ds   = isoDate(date);
      const ev   = eventsOnDay(ds);
      const todayCls = isToday(date) ? ' today' : '';
      html += `<div class="cal-day${todayCls}" data-date="${ds}" tabindex="0" role="gridcell" aria-label="${d}. ${MONTHS[m]}">
        <span class="cal-day-num">${d}</span>
        <div class="cal-events-mini">
          ${ev.slice(0, 3).map(e => `<div class="ev-dot" style="background:${e.color||'var(--accent)'}" title="${sanitize(e.title)}">${sanitize(e.title)}</div>`).join('')}
          ${ev.length > 3 ? `<div class="ev-more">+${ev.length - 3}</div>` : ''}
        </div>
      </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
    bindDayClicks();
    updateCount();
  }

  // ── Render week ───────────────────────────────────────────────────────────
  function renderWeek() {
    const dow = (viewDate.getDay() + 6) % 7;
    const monday = new Date(viewDate);
    monday.setDate(viewDate.getDate() - dow);
    titleBar.textContent = `Woche vom ${formatDate(monday)}`;
    body.className = 'cal-body cal-week';

    let html = '<div class="cal-week-grid">';
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const ds = isoDate(d);
      const ev = eventsOnDay(ds);
      const todayCls = isToday(d) ? ' today' : '';
      html += `<div class="cal-week-col${todayCls}" data-date="${ds}" tabindex="0" role="gridcell" aria-label="${DOW[i]} ${formatDate(d)}">
        <div class="cal-week-hdr">${DOW[i]}<br><strong>${d.getDate()}</strong></div>
        <div class="cal-week-events">
          ${ev.map(e => `<div class="ev-block" data-id="${e.id}" style="background:${e.color||'var(--accent)'}22;border-left:3px solid ${e.color||'var(--accent)'}">
            <strong>${sanitize(e.title)}</strong>
            ${e.time ? `<br><small>${sanitize(e.time)}</small>` : ''}
          </div>`).join('')}
        </div>
      </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
    bindDayClicks();
    bindEventClicks();
    updateCount();
  }

  // ── Render day ────────────────────────────────────────────────────────────
  function renderDay() {
    const ds = isoDate(viewDate);
    titleBar.textContent = formatDate(viewDate);
    body.className = 'cal-body cal-day-view';
    const ev = eventsOnDay(ds);

    let html = `<div class="cal-day-header${isToday(viewDate) ? ' today' : ''}">
      <span>${formatDate(viewDate)}</span>
      <button class="btn btn-ghost btn-sm" data-date="${ds}" id="add-day-ev">${icon('plus', 14)} Termin</button>
    </div>`;
    if (!ev.length) html += '<div class="cal-no-events">Keine Termine.</div>';
    else ev.forEach(e => {
      html += `<div class="ev-card" data-id="${e.id}" style="border-left:4px solid ${e.color||'var(--accent)'}">
        <div class="ev-card-title">${sanitize(e.title)}</div>
        ${e.time ? `<div class="ev-card-time">${sanitize(e.time)}</div>` : ''}
        ${e.desc ? `<div class="ev-card-desc">${sanitize(e.desc)}</div>` : ''}
        <button class="btn btn-ghost btn-sm ev-edit" data-id="${e.id}" style="margin-top:6px">${icon('settings', 13)} Bearbeiten</button>
        <button class="btn btn-ghost btn-sm ev-del" data-id="${e.id}">${icon('trash', 13)}</button>
      </div>`;
    });
    body.innerHTML = html;
    container.querySelector('#add-day-ev')?.addEventListener('click', () => openEventForm(ds));
    bindEventClicks();
    updateCount();
  }

  // ── Render dispatcher ─────────────────────────────────────────────────────
  function render() {
    if (view === 'month') renderMonth();
    else if (view === 'week') renderWeek();
    else renderDay();
  }

  function bindDayClicks() {
    body.querySelectorAll('[data-date]').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('.ev-dot, .ev-block')) return;
        openEventForm(el.dataset.date);
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') openEventForm(el.dataset.date); });
    });
  }

  function bindEventClicks() {
    body.querySelectorAll('.ev-block, .ev-dot').forEach(el => {
      const id = el.dataset.id || el.closest('[data-id]')?.dataset.id;
      if (id) el.addEventListener('click', e => { e.stopPropagation(); openEventDetail(id); });
    });
    body.querySelectorAll('.ev-edit').forEach(btn => {
      btn.addEventListener('click', () => openEventDetail(btn.dataset.id));
    });
    body.querySelectorAll('.ev-del').forEach(btn => {
      btn.addEventListener('click', () => deleteEvent(btn.dataset.id));
    });
  }

  function updateCount() {
    countEl.textContent = `${events.length} Termin${events.length !== 1 ? 'e' : ''}`;
  }

  // ── Event form ────────────────────────────────────────────────────────────
  function openEventForm(dateStr, existingId = null) {
    const ex = existingId ? events.find(e => e.id === existingId) : null;
    showModal(`
      <h3>${ex ? 'Termin bearbeiten' : 'Neuer Termin'}</h3>
      <div class="form-group"><label>Titel</label><input type="text" id="ev-title" value="${sanitize(ex?.title || '')}" /></div>
      <div class="form-group"><label>Datum</label><input type="date" id="ev-date" value="${ex?.date || dateStr}" /></div>
      <div class="form-group"><label>Uhrzeit</label><input type="time" id="ev-time" value="${ex?.time || ''}" /></div>
      <div class="form-group"><label>Beschreibung</label><textarea id="ev-desc" rows="3">${sanitize(ex?.desc || '')}</textarea></div>
      <div class="form-group">
        <label>Farbe</label>
        <input type="color" id="ev-color" value="${ex?.color || '#7c3aed'}" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-cancel">Abbrechen</button>
        ${ex ? `<button class="btn btn-danger btn-del-ev">Löschen</button>` : ''}
        <button class="btn btn-primary btn-ok">${ex ? 'Speichern' : 'Hinzufügen'}</button>
      </div>
    `, (modal) => {
      const title = modal.querySelector('#ev-title').value.trim();
      if (!title) { showNotify('Bitte einen Titel eingeben.', 'warn'); return; }
      const ev = {
        id:    ex?.id || JarvisDB.genId(),
        title,
        date:  modal.querySelector('#ev-date').value || dateStr,
        time:  modal.querySelector('#ev-time').value,
        desc:  modal.querySelector('#ev-desc').value,
        color: modal.querySelector('#ev-color').value,
      };
      if (ex) {
        const idx = events.findIndex(e => e.id === ex.id);
        if (idx !== -1) events[idx] = ev;
      } else {
        events.push(ev);
      }
      persist(); render();
    });
    // delete from form
    setTimeout(() => {
      document.querySelector('.btn-del-ev')?.addEventListener('click', () => {
        if (!confirm('Termin löschen?')) return;
        deleteEvent(existingId);
        document.querySelector('.modal-overlay')?.remove();
      });
    }, 0);
  }

  function openEventDetail(id) { openEventForm(null, id); }

  function deleteEvent(id) {
    events = events.filter(e => e.id !== id);
    persist(); render();
  }

  // ── Nav ───────────────────────────────────────────────────────────────────
  container.querySelector('#cal-prev').addEventListener('click', () => {
    if (view === 'month')  viewDate.setMonth(viewDate.getMonth() - 1);
    else if (view === 'week') viewDate.setDate(viewDate.getDate() - 7);
    else viewDate.setDate(viewDate.getDate() - 1);
    render();
  });
  container.querySelector('#cal-next').addEventListener('click', () => {
    if (view === 'month')  viewDate.setMonth(viewDate.getMonth() + 1);
    else if (view === 'week') viewDate.setDate(viewDate.getDate() + 7);
    else viewDate.setDate(viewDate.getDate() + 1);
    render();
  });
  container.querySelector('#cal-today').addEventListener('click', () => { viewDate = new Date(); render(); });

  container.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      view = btn.dataset.view;
      render();
    });
  });

  container.querySelector('#cal-new-event').addEventListener('click', () => openEventForm(isoDate(viewDate)));
  container.querySelector('.back-btn').addEventListener('click', goHome);

  render();
}

</script>
