<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Office</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <!-- Splash / Launcher -->
    <div id="launcher" class="launcher">
      <header class="launcher-header">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#1a1a2e"/>
            <path d="M12 24 L24 12 L36 24 L24 36 Z" fill="#7c3aed" opacity="0.8"/>
            <circle cx="24" cy="24" r="6" fill="#a78bfa"/>
          </svg>
          <span>Jarvis Office</span>
        </div>
        <div class="launcher-meta">
          <span id="clock"></span>
        </div>
      </header>

      <main class="launcher-grid">
        <button class="app-card" onclick="launchApp('write')" data-app="write">
          <div class="app-icon write-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="6" y="6" width="28" height="32" rx="3" fill="#3b82f6" opacity="0.15"/><rect x="6" y="6" width="28" height="32" rx="3" stroke="#3b82f6" stroke-width="2"/><line x1="12" y1="14" x2="28" y2="14" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="20" x2="28" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="26" x2="22" y2="26" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span class="app-name">Jarvis Write</span>
          <span class="app-desc">Textverarbeitung</span>
        </button>

        <button class="app-card" onclick="launchApp('calc')" data-app="calc">
          <div class="app-icon calc-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="5" width="30" height="30" rx="3" fill="#10b981" opacity="0.15"/><rect x="5" y="5" width="30" height="30" rx="3" stroke="#10b981" stroke-width="2"/><line x1="5" y1="14" x2="35" y2="14" stroke="#10b981" stroke-width="1.5"/><line x1="5" y1="22" x2="35" y2="22" stroke="#10b981" stroke-width="1.5"/><line x1="14" y1="5" x2="14" y2="35" stroke="#10b981" stroke-width="1.5"/><line x1="23" y1="5" x2="23" y2="35" stroke="#10b981" stroke-width="1.5"/></svg>
          </div>
          <span class="app-name">Jarvis Calc</span>
          <span class="app-desc">Tabellenkalkulation</span>
        </button>

        <button class="app-card" onclick="launchApp('matrix')" data-app="matrix">
          <div class="app-icon matrix-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="5" width="30" height="30" rx="3" fill="#f59e0b" opacity="0.15"/><rect x="5" y="5" width="30" height="30" rx="3" stroke="#f59e0b" stroke-width="2"/><polyline points="8,28 16,18 22,24 30,12" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="30" cy="12" r="2" fill="#f59e0b"/></svg>
          </div>
          <span class="app-name">Jarvis Matrix</span>
          <span class="app-desc">Smart-Tabellen + KI</span>
        </button>

        <button class="app-card" onclick="launchApp('draw')" data-app="draw">
          <div class="app-icon draw-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="5" width="30" height="30" rx="3" fill="#ec4899" opacity="0.15"/><rect x="5" y="5" width="30" height="30" rx="3" stroke="#ec4899" stroke-width="2"/><path d="M12 28 Q18 15 26 22 Q32 28 28 12" stroke="#ec4899" stroke-width="2" fill="none"/><circle cx="12" cy="28" r="2" fill="#ec4899"/></svg>
          </div>
          <span class="app-name">Jarvis Draw</span>
          <span class="app-desc">Vektorgrafik</span>
        </button>

        <button class="app-card" onclick="launchApp('present')" data-app="present">
          <div class="app-icon present-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="8" width="32" height="22" rx="3" fill="#8b5cf6" opacity="0.15"/><rect x="4" y="8" width="32" height="22" rx="3" stroke="#8b5cf6" stroke-width="2"/><line x1="20" y1="30" x2="20" y2="36" stroke="#8b5cf6" stroke-width="2"/><line x1="14" y1="36" x2="26" y2="36" stroke="#8b5cf6" stroke-width="2"/></svg>
          </div>
          <span class="app-name">Jarvis Present</span>
          <span class="app-desc">Präsentationen</span>
        </button>

        <button class="app-card" onclick="launchApp('mail')" data-app="mail">
          <div class="app-icon mail-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="10" width="30" height="22" rx="3" fill="#06b6d4" opacity="0.15"/><rect x="5" y="10" width="30" height="22" rx="3" stroke="#06b6d4" stroke-width="2"/><polyline points="5,12 20,23 35,12" stroke="#06b6d4" stroke-width="2" fill="none"/></svg>
          </div>
          <span class="app-name">Jarvis Mail</span>
          <span class="app-desc">E-Mail-Client</span>
        </button>

        <button class="app-card" onclick="launchApp('notes')" data-app="notes">
          <div class="app-icon notes-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="7" y="5" width="22" height="30" rx="2" fill="#f97316" opacity="0.15"/><rect x="7" y="5" width="22" height="30" rx="2" stroke="#f97316" stroke-width="2"/><rect x="11" y="3" width="4" height="6" rx="1" fill="#f97316"/><rect x="17" y="3" width="4" height="6" rx="1" fill="#f97316"/><line x1="12" y1="18" x2="24" y2="18" stroke="#f97316" stroke-width="1.5"/><line x1="12" y1="23" x2="22" y2="23" stroke="#f97316" stroke-width="1.5"/><line x1="28" y1="22" x2="35" y2="15" stroke="#f97316" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span class="app-name">Jarvis Notes</span>
          <span class="app-desc">Schnellnotizen</span>
        </button>

        <button class="app-card" onclick="launchApp('chat')" data-app="chat">
          <div class="app-icon chat-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="6" width="32" height="22" rx="4" fill="#6366f1" opacity="0.15"/><rect x="4" y="6" width="32" height="22" rx="4" stroke="#6366f1" stroke-width="2"/><circle cx="13" cy="17" r="2" fill="#6366f1"/><circle cx="20" cy="17" r="2" fill="#6366f1"/><circle cx="27" cy="17" r="2" fill="#6366f1"/><path d="M12 28 L8 34" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span class="app-name">Jarvis Chat</span>
          <span class="app-desc">KI-Chat + Prompts</span>
        </button>

        <button class="app-card" onclick="launchApp('calendar')" data-app="calendar">
          <div class="app-icon cal-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="8" width="30" height="28" rx="3" fill="#14b8a6" opacity="0.15"/><rect x="5" y="8" width="30" height="28" rx="3" stroke="#14b8a6" stroke-width="2"/><line x1="5" y1="16" x2="35" y2="16" stroke="#14b8a6" stroke-width="2"/><rect x="12" y="4" width="4" height="8" rx="2" fill="#14b8a6"/><rect x="24" y="4" width="4" height="8" rx="2" fill="#14b8a6"/><rect x="12" y="21" width="5" height="5" rx="1" fill="#14b8a6" opacity="0.6"/><rect x="22" y="21" width="5" height="5" rx="1" fill="#14b8a6" opacity="0.6"/></svg>
          </div>
          <span class="app-name">Jarvis Calendar</span>
          <span class="app-desc">Kalender & Termine</span>
        </button>
      </main>

      <footer class="launcher-footer">
        <button onclick="openSettings()" class="btn-ghost">⚙ Einstellungen</button>
        <span>Jarvis Office v1.0 — dein persönliches Office</span>
      </footer>
    </div>

    <!-- App Container -->
    <div id="app-container" class="app-container hidden"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/launcher.js"></script>
  <script src="js/write.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/present.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
